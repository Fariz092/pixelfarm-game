<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Farm HD</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        /* Container game biar responsif */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            background-color: #4a7c59;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }
        /* Rotate overlay kalau masih portrait */
        #rotate-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        @media (orientation: landscape) {
            #rotate-overlay { display: none; }
        }
    </style>
</head>
<body>
    <!-- Overlay muter layar -->
    <div id="rotate-overlay">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 20px; animation: spin 2s linear infinite;">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
        </svg>
        <h2 style="margin:0 0 10px 0;">Miringkan HP Lu</h2>
        <p style="margin:0; color:#888;">Game ini lebih seru dimainkan dalam mode landscape.</p>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <div id="game-container">
        <div id="loading">Menyiapkan Lahan...</div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
